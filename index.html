<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mafia Online (Local)</title>
<style>
body{font-family:Arial; background:#0f1724; color:#e6eef6; margin:0; padding:20px;}
h1{margin-bottom:10px;}
button,input{padding:8px; margin:4px; border-radius:6px; border:none;}
.player{padding:6px; background:#071021; margin:4px; border-radius:6px;}
.role-badge{background:#7dd3fc33; padding:3px 6px; border-radius:6px;}
#log{background:#071021; padding:10px; max-height:200px; overflow:auto; margin-top:12px;}
.hidden{display:none;}
</style>
</head>
<body>
<h1>Mafia Online (Local)</h1>

<div id="lobby">
<input id="nameInput" placeholder="Your name">
<button id="createBtn">Create Game</button>
<button id="joinBtn">Join Game</button>
<div id="playersGrid"></div>
</div>

<div id="gameArea" class="hidden">
<p>You: <span id="youName"></span> <span id="youRole" class="role-badge"></span></p>
<p>Phase: <span id="phaseText">waiting</span></p>

<div id="nightPanel" class="hidden">
<h3>Night Actions</h3>
<div id="nightInstructions"></div>
<div id="nightTargets"></div>
<button id="submitNight">Submit Night Action</button>
</div>

<div id="dayPanel" class="hidden">
<h3>Day Voting</h3>
<div id="voteTargets"></div>
<button id="submitVote">Vote</button>
</div>

<div id="log"></div>
<button id="nextBtn" class="hidden">Next Phase (Host)</button>
</div>

<script>
// ----- Game Variables -----
let roomPlayers = {}; // all players in this browser session
let playerId = null;
let displayName = '';
let role = '';
let alive = true;
let phase = 'lobby'; // lobby, night, day
let hostId = null;

// ----- UI Elements -----
const nameInput = document.getElementById('nameInput');
const createBtn = document.getElementById('createBtn');
const joinBtn = document.getElementById('joinBtn');
const playersGrid = document.getElementById('playersGrid');
const gameArea = document.getElementById('gameArea');
const youNameEl = document.getElementById('youName');
const youRoleEl = document.getElementById('youRole');
const phaseText = document.getElementById('phaseText');
const nightPanel = document.getElementById('nightPanel');
const nightInstructions = document.getElementById('nightInstructions');
const nightTargets = document.getElementById('nightTargets');
const submitNight = document.getElementById('submitNight');
const dayPanel = document.getElementById('dayPanel');
const voteTargets = document.getElementById('voteTargets');
const submitVote = document.getElementById('submitVote');
const logEl = document.getElementById('log');
const nextBtn = document.getElementById('nextBtn');

// ----- Helpers -----
function log(msg){ const p=document.createElement('div'); p.textContent=msg; logEl.prepend(p); }

function updatePlayersGrid(){
    playersGrid.innerHTML='';
    Object.values(roomPlayers).forEach(p=>{
        const d=document.createElement('div');
        d.className='player';
        d.textContent=p.name + (p.alive?'':' (dead)');
        playersGrid.appendChild(d);
    });
}

// ----- Game Logic -----
function assignRoles(){
    const ids = Object.keys(roomPlayers);
    let numPlayers = ids.length;
    let mafiaCount = Math.max(1, Math.floor(numPlayers/4));
    let rolesArr = [];
    for(let i=0;i<mafiaCount;i++) rolesArr.push('Mafia');
    rolesArr.push('Doctor'); rolesArr.push('Detective');
    while(rolesArr.length < numPlayers) rolesArr.push('Citizen');
    // shuffle
    rolesArr = rolesArr.sort(()=>Math.random()-0.5);
    ids.forEach((id,i)=>{ roomPlayers[id].role=rolesArr[i]; });
}

function showNight(){
    phase='night';
    phaseText.textContent='Night';
    nightPanel.classList.remove('hidden');
    dayPanel.classList.add('hidden');
    nextBtn.classList.add('hidden');

    nightTargets.innerHTML='';
    nightInstructions.innerHTML='';

    if(role==='Mafia'){
        nightInstructions.textContent='Choose someone to kill';
    } else if(role==='Doctor'){
        nightInstructions.textContent='Choose someone to heal';
    } else if(role==='Detective'){
        nightInstructions.textContent='Choose someone to investigate';
    } else {
        nightInstructions.textContent='Wait for the night to end';
        nightTargets.innerHTML='<em>No action required</em>';
        submitNight.classList.add('hidden');
        return;
    }

    submitNight.classList.remove('hidden');
    Object.keys(roomPlayers).forEach(id=>{
        if(roomPlayers[id].alive && id!==playerId){
            const btn=document.createElement('button');
            btn.textContent=roomPlayers[id].name;
            btn.onclick=()=>{ nightTargets.dataset.target=id; log('Selected '+roomPlayers[id].name); };
            nightTargets.appendChild(btn);
        }
    });
}

function showDay(){
    phase='day';
    phaseText.textContent='Day';
    nightPanel.classList.add('hidden');
    dayPanel.classList.remove('hidden');
    nextBtn.classList.add('hidden');

    voteTargets.innerHTML='';
    Object.keys(roomPlayers).forEach(id=>{
        if(roomPlayers[id].alive && id!==playerId){
            const btn=document.createElement('button');
            btn.textContent=roomPlayers[id].name;
            btn.onclick=()=>{ voteTargets.dataset.vote=id; log('Voted '+roomPlayers[id].name); };
            voteTargets.appendChild(btn);
        }
    });
}

// ----- Event Listeners -----
createBtn.onclick=()=>{
    playerId='P_'+Date.now(); displayName=nameInput.value||'Player';
    hostId=playerId;
    roomPlayers[playerId]={name:displayName, alive:true};
    gameArea.classList.remove('hidden'); document.getElementById('lobby').classList.add('hidden');
    youNameEl.textContent=displayName;
    updatePlayersGrid();
    log('Game created. You are host.');
};

joinBtn.onclick=()=>{
    playerId='P_'+Date.now(); displayName=nameInput.value||'Player';
    roomPlayers[playerId]={name:displayName, alive:true};
    gameArea.classList.remove('hidden'); document.getElementById('lobby').classList.add('hidden');
    youNameEl.textContent=displayName;
    updatePlayersGrid();
    log('Joined game.');
};

nextBtn.onclick=()=>{
    if(phase==='night') showDay();
    else showNight();
};

submitNight.onclick=()=>{
    const targetId=nightTargets.dataset.target;
    if(!targetId) return alert('Select a target!');
    log('Night action submitted on '+roomPlayers[targetId].name);
    // Simple resolution
    if(role==='Mafia'){
        roomPlayers[targetId].alive=false;
        log('You killed '+roomPlayers[targetId].name);
    } else if(role==='Doctor'){
        roomPlayers[targetId].alive=true;
        log('You healed '+roomPlayers[targetId].name);
    } else if(role==='Detective'){
        log(roomPlayers[targetId].name+' role: '+roomPlayers[targetId].role);
    }
    updatePlayersGrid();
    showDay();
};

submitVote.onclick=()=>{
    const voteId=voteTargets.dataset.vote;
    if(!voteId) return alert('Select someone to vote!');
    roomPlayers[voteId].alive=false;
    log('Voted out '+roomPlayers[voteId].name);
    updatePlayersGrid();
    showNight();
};
</script>
</body>
</html>
